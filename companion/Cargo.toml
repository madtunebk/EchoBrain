[package]
name = "companion"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "companion"
path = "src/main.rs"

[dependencies]
anyhow = "1"
candle-core = "0.11.0"
candle-nn = "0.11.0"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
